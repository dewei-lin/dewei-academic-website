<svg viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Upload -->
  <rect x="260" y="10" width="300" height="60" rx="10" fill="none" stroke="#b509ac" stroke-width="2.5"/>
  <text x="410" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#333333">Upload</text>
  <text x="410" y="55" text-anchor="middle" font-size="12" fill="#333333">one or more files + optional codebook</text>

  <line x1="410" y1="70" x2="410" y2="105" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Intake -->
  <rect x="210" y="107" width="400" height="60" rx="10" fill="none" stroke="#b509ac" stroke-width="2.5"/>
  <text x="410" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#333333">Intake</text>
  <text x="410" y="152" text-anchor="middle" font-size="12" fill="#333333">detect structure (single / split / join / multimodal), read documentation</text>

  <line x1="410" y1="167" x2="410" y2="202" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="230" y="204" width="360" height="60" rx="10" fill="#b509ac" stroke="#b509ac" stroke-width="2.5"/>
  <text x="410" y="229" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Orchestrator</text>
  <text x="410" y="249" text-anchor="middle" font-size="12" fill="#ffffff">coordinates stages, manages human-in-the-loop checkpoints</text>

  <line x1="410" y1="264" x2="410" y2="299" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stages container -->
  <rect x="60" y="301" width="700" height="220" rx="10" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="80" y="325" font-size="12" font-weight="700" fill="#333333" letter-spacing="0.5">CLEANING STAGES</text>

  <!-- Row 1: Profiling -> Companion matching -> Format -->
  <rect x="80" y="338" width="180" height="50" rx="8" fill="none" stroke="#b509ac" stroke-width="2"/>
  <text x="170" y="368" text-anchor="middle" font-size="13" fill="#333333">Profiling</text>

  <line x1="260" y1="363" x2="290" y2="363" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="292" y="338" width="220" height="50" rx="8" fill="none" stroke="#b509ac" stroke-width="2"/>
  <text x="402" y="368" text-anchor="middle" font-size="13" fill="#333333">Companion matching</text>

  <line x1="512" y1="363" x2="542" y2="363" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="544" y="338" width="176" height="50" rx="8" fill="none" stroke="#b509ac" stroke-width="2"/>
  <text x="632" y="368" text-anchor="middle" font-size="13" fill="#333333">Format</text>

  <!-- connector row1 -> row2 -->
  <line x1="632" y1="388" x2="632" y2="404" stroke="#333333" stroke-width="2"/>
  <line x1="632" y1="404" x2="170" y2="404" stroke="#333333" stroke-width="2"/>
  <line x1="170" y1="404" x2="170" y2="418" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Duplicates -> Missingness -> Outliers -->
  <rect x="80" y="420" width="180" height="50" rx="8" fill="none" stroke="#b509ac" stroke-width="2"/>
  <text x="170" y="450" text-anchor="middle" font-size="13" fill="#333333">Duplicates</text>

  <line x1="260" y1="445" x2="290" y2="445" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="292" y="420" width="220" height="50" rx="8" fill="none" stroke="#b509ac" stroke-width="2"/>
  <text x="402" y="450" text-anchor="middle" font-size="13" fill="#333333">Missingness</text>

  <line x1="512" y1="445" x2="542" y2="445" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="544" y="420" width="176" height="50" rx="8" fill="none" stroke="#b509ac" stroke-width="2"/>
  <text x="632" y="450" text-anchor="middle" font-size="13" fill="#333333">Outliers</text>

  <!-- connector row2 -> row3 -->
  <line x1="632" y1="470" x2="632" y2="486" stroke="#333333" stroke-width="2"/>
  <line x1="632" y1="486" x2="400" y2="486" stroke="#333333" stroke-width="2"/>
  <line x1="400" y1="486" x2="400" y2="500" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: Feature engineering -->
  <rect x="80" y="502" width="640" height="50" rx="8" fill="none" stroke="#b509ac" stroke-width="2"/>
  <text x="400" y="532" text-anchor="middle" font-size="13" fill="#333333">Feature engineering (binning &#183; scaling &#183; encoding)</text>

  <line x1="410" y1="521" x2="410" y2="556" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Human-in-the-loop -->
  <rect x="180" y="558" width="460" height="60" rx="10" fill="#b509ac" stroke="#b509ac" stroke-width="2.5"/>
  <text x="410" y="583" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Human-in-the-Loop Checkpoints</text>
  <text x="410" y="603" text-anchor="middle" font-size="12" fill="#ffffff">judgment decisions surfaced as cards; confirmed, overridden, or defaulted</text>

  <line x1="410" y1="618" x2="410" y2="653" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output generation -->
  <rect x="140" y="655" width="540" height="90" rx="10" fill="none" stroke="#b509ac" stroke-width="2.5"/>
  <text x="410" y="680" text-anchor="middle" font-size="16" font-weight="700" fill="#333333">Output generation</text>
  <text x="410" y="700" text-anchor="middle" font-size="12" fill="#333333">clean data &#183; audit report &#183; CONSORT flowchart</text>
  <text x="410" y="718" text-anchor="middle" font-size="12" fill="#333333">JSON log &#183; reproducible script</text>
  <text x="410" y="736" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&#8594; then automatic reproducibility check</text>
</svg>
